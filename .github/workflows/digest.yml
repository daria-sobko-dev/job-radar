name: Daily digest

on:
  schedule:
    # 06:17 UTC = 07:17 in Valencia in winter, 08:17 in summer.
    # Not on the hour: GitHub delays many jobs scheduled at :00.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest in the log instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write  # to commit data/seen.json

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m jobradar --config config.yaml --dry-run --explain
          else
            python -m jobradar --config config.yaml
          fi

      - name: Save seen jobs
        if: ${{ inputs.dry_run != true }}
        run: |
          [ -f data/seen.json ] || { echo "No state file yet"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
